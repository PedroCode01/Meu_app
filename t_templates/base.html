<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}Perfil do Usuário{% endblock %}</title>

    <!-- Bootstrap CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- CSS personalizado -->
    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/estilo.css') }}"
    >

    <!-- JavaScript -->
    <script
        src="{{ url_for('static', filename='js/script1.js') }}"
        defer
    ></script>
</head>

<body>

    <!-- Cabeçalho -->
    <header>

        <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
            <div class="container">

                <a class="navbar-brand" href="{{ url_for('index') }}">
                    <img
                        class = img_quadrada
                        src="{{ url_for('static', filename='img/logo_ifro.png') }}"
                        alt="Logo do IFRO"
                        width="50"
                        height="50"
                        class="rounded"
                    >
                </a>

                <!-- Botão para telas pequenas -->
                <button
                    class="navbar-toggler"
                    type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#menuPrincipal"
                    aria-controls="menuPrincipal"
                    aria-expanded="false"
                    aria-label="Abrir menu"
                >
                    <span class="navbar-toggler-icon"></span>
                </button>

                <!-- Menu -->
                <div class="collapse navbar-collapse" id="menuPrincipal">

                    <ul class="navbar-nav ms-auto">

                        <li class="nav-item">
                            <a
                                class="nav-link"
                                href="{{ url_for('index') }}"
                            >
                                Página Inicial
                            </a>
                        </li>

                        <li class="nav-item">
                            <a
                                class="nav-link"
                                href="{{ url_for('contato') }}"
                            >
                                Contatos
                            </a>
                        </li>

                        <li class="nav-item">
                            <a
                                class="nav-link"
                                href="{{ url_for('dados_usuario') }}"
                            >
                                Usuário
                            </a>
                        </li>

                        <li class="nav-item">
                            <a
                                class="nav-link"
                                href="{{ url_for('login') }}"
                            >
                                Login
                            </a>
                        </li>

                    </ul>

                </div>
            </div>
        </nav>

    </header>

    <!-- Conteúdo das páginas -->
    <main class="container py-4">

        {% block content %}
        {% endblock %}

    </main>

    <!-- Rodapé -->
    <footer class="bg-dark text-white text-center py-3 mt-5">

        <div class="container">
            <p class="mb-0">
                Copyright © 2026 Pedro Antunes.
                Todos os direitos reservados.
            </p>
        </div>

    </footer>

    <!-- Bootstrap JavaScript -->
    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    ></script>

    <!-- JavaScript do projeto -->
    <script
        src="{{ url_for('static', filename='js/config.js') }}"
        defer
    ></script>

</body>

</html>
