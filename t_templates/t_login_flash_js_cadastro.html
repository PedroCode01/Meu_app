{% extends 'base.html' %}

{% block scripts %}
<script>
    function preencherNomeUsuario() {
        const campoNome = document.getElementById("nome_usuario");
        const campoCadastro = document.getElementById("nome_usuario_cadastro");
        
        if (campoNome && campoCadastro) {
            // Correção: nomeUsuario com 'u' minúsculo (conforme declarado)
            campoCadastro.value = campoNome.value;
        }
    }
</script>
<script src="{{ url_for('static', filename='js/script1.js') }}" defer></script>
{% endblock %}

{% block content %}
{% set mensagens = get_flashed_messages() %}
{% if mensagens %}
<div class="mensagens-flash">
    <ul>
        {% for msg in mensagens %}
        <li>{{ msg }}</li>
        {% endfor %}
    </ul>
</div>
{% endif %}

<br />
<!-- Formulário para login -->
<form action="/autenticar" method="POST" id="formLogin">
    <label for="nome_usuario">Usuário:</label>
    <input type="text" id="nome_usuario" name="nome_usuario" required>
    
    <label for="senha">Senha:</label>
    <input type="password" id="senha" name="senha" required><br>
    
    <button type="submit">Login</button>
</form>

<br>
<!-- Formulário para novo cadastro -->
<form action="/novocadastro/" method="POST" id="formCadastro" onsubmit="preencherNomeUsuario()">
    <input type="hidden" name="nome_usuario" id="nome_usuario_cadastro">
    <button type="submit">Novo Cadastro</button>
</form>

{% endblock %}
